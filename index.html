<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16805c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="やまマップ" />
    <meta name="description" content="GPSで現在地・軌跡を記録できる山歩き用の地図（国土地理院タイル・3D地形）" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>やまマップ</title>
  </head>
  <body>
    <div id="map" role="application" aria-label="地図"></div>

    <div id="status" class="chip" hidden></div>

    <section id="panel" aria-label="記録">
      <div id="stats" hidden>
        <div><span class="label">時間</span><span id="s-time" class="value">0:00</span></div>
        <div><span class="label">距離</span><span id="s-dist" class="value">0 m</span></div>
        <div><span class="label">登り</span><span id="s-up" class="value">0 m</span></div>
        <div><span class="label">下り</span><span id="s-down" class="value">0 m</span></div>
        <div><span class="label">標高</span><span id="s-ele" class="value">–</span></div>
      </div>
      <canvas id="profile" hidden></canvas>
      <div id="actions">
        <button id="btn-profile" class="icon-btn" type="button" aria-label="標高グラフ" title="標高グラフ" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M3 17l5-7 4 4 3-5 6 8" /></svg>
        </button>
        <button id="btn-rec" class="rec-btn" type="button">
          <span class="dot" aria-hidden="true"></span><span class="text">記録開始</span>
        </button>
        <button id="btn-menu" class="icon-btn" type="button" aria-label="メニュー" title="メニュー">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
      </div>
    </section>

    <dialog id="menu" aria-label="メニュー">
      <form method="dialog" class="sheet">
        <header>
          <h2>やまマップ</h2>
          <button class="close" value="close" aria-label="閉じる">✕</button>
        </header>

        <section>
          <h3>地図</h3>
          <div class="segmented" id="base-layers" role="radiogroup" aria-label="背景地図"></div>
          <label class="toggle"><input type="checkbox" id="opt-hillshade" /> 陰影（起伏）を重ねる</label>
        </section>

        <section>
          <h3>記録</h3>
          <label class="toggle"><input type="checkbox" id="opt-wakelock" /> 記録中は画面を点けたままにする</label>
          <p class="note">
            Web版は画面を消すと測位が止まります。ポケットに入れたまま記録するにはアプリ版が必要です（README参照）。
          </p>
          <ul id="track-list" class="list"></ul>
        </section>

        <section>
          <h3>ルート（GPX）</h3>
          <div class="row">
            <label class="btn"><input type="file" id="gpx-file" accept=".gpx,application/gpx+xml,application/xml,text/xml" hidden />GPXを読み込む</label>
            <button type="button" class="btn" id="btn-route-clear" disabled>ルートを消す</button>
          </div>
          <p class="note" id="route-info"></p>
        </section>

        <section>
          <h3>オフライン</h3>
          <div class="row">
            <button type="button" class="btn" id="btn-offline">表示中の範囲を保存</button>
            <button type="button" class="btn" id="btn-cache-clear">保存した地図を削除</button>
          </div>
          <p class="note" id="offline-info">山では電波が届かないことが多いので、出発前に保存しておくと安心です。</p>
          <progress id="offline-progress" hidden></progress>
          <p class="note" id="storage-info"></p>
        </section>

        <section class="about">
          <p>
            地図・標高データ: <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院（地理院タイル）</a>
          </p>
          <p class="note">この地図は登山計画の参考です。紙の地図とコンパス、登山届の提出もお忘れなく。</p>
        </section>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
